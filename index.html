<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProgBank — Личный Кабинет</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --gold: #eab308;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .hidden {
            display: none !important;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: var(--accent-hover);
        }

        .balance-card {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .balance-card::after {
            content: "BANK";
            position: absolute;
            right: -10px;
            bottom: -10px;
            font-size: 60px;
            font-weight: 900;
            opacity: 0.1;
        }

        .balance-label {
            font-size: 14px;
            color: #bfdbfe;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: bold;
            margin-top: 5px;
            color: #ffffff;
        }

        .coin-icon {
            color: var(--gold);
        }

        .user-info {
            font-size: 18px;
            margin-bottom: 10px;
            color: var(--text-muted);
        }

        .user-info span {
            color: var(--text-main);
            font-weight: bold;
        }

        .role-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 5px;
        }

        .role-admin { background: #ef4444; color: white; }
        .role-user { background: #10b981; color: white; }

        .admin-panel {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #334155;
            text-align: left;
        }

        .admin-panel h3 {
            color: #f87171;
            margin-bottom: 15px;
            font-size: 18px;
        }

        select {
            width: 100%;
            padding: 12px;

background: #0f172a;
            color: white;
            border: 2px solid #334155;
            border-radius: 8px;
            margin-bottom: 10px;
            outline: none;
        }

        .logout-btn {
            background: #475569;
            margin-top: 15px;
        }
        .logout-btn:hover {
            background: #334155;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Окно входа -->
        <div id="auth-screen">
            <h2>Добро пожаловать в ProgBank</h2>
            <p style="color: var(--text-muted); margin-bottom: 15px; font-size: 14px;">
                Введите ваш никнейм для входа
            </p>
            <input type="text" id="username-input" placeholder="Ваш никнейм..." autocomplete="off">
            <button onclick="login()">Войти</button>
        </div>

        <!-- Экран банка -->
        <div id="bank-screen" class="hidden">
            <div class="user-info">
                Привет, <span id="user-display-name">Игрок</span>!
                <br>
                <span id="role-container"></span>
            </div>

            <div class="balance-card">
                <div class="balance-label">Текущий баланс</div>
                <div class="balance-amount"><span id="balance-value">0</span> <span class="coin-icon">🪙 </span></div>
            </div>

            <!-- Панель Администратора -->
            <div id="admin-area" class="admin-panel hidden">
                <h3>👑  Панель Администратора</h3>
                
                <label for="user-select" style="font-size: 14px; color: var(--text-muted);">Выберите игрока:</label>
                <select id="user-select"></select>

                <input type="number" id="coin-amount" placeholder="Количество монет">
                <button onclick="modifyBalance()" style="background: #ef4444;">Выдать / Забрать</button>
            </div>

            <button class="logout-btn" onclick="logout()">Выйти из аккаунта</button>
        </div>
    </div>

    <script>
        // Имя главного админа
        const ADMIN_NICKNAME = "chelikxax67";

        // Загрузка базы данных и текущей сессии
        let db = JSON.parse(localStorage.getItem('bank_users')) || {};
        let currentUser = localStorage.getItem('bank_current_user') || null;

        // Проверяем при загрузке страницы: если юзер уже был залогинен, сразу пускаем его
        window.onload = function() {
            if (currentUser && db[currentUser]) {
                showBankScreen();
            } else {
                // На случай, если в сессии остался ник, которого нет в локальной БД устройства
                currentUser = null;
                localStorage.removeItem('bank_current_user');
            }
        };

        // Функция входа
        function login() {
            const usernameInput = document.getElementById('username-input').value.trim();
            
            if (!usernameInput) {
                alert('Пожалуйста, введите никнейм!');
                return;
            }

            const username = usernameInput.toLowerCase();

            // Если пользователя нет в локальной базе устройства — создаем его
            if (!db[username]) {
                db[username] = {
                    name: usernameInput,
                    balance: 0
                };
                saveDB();
            }

            // Сохраняем сессию, чтобы не вылетало при обновлении
            currentUser = username;
            localStorage.setItem('bank_current_user', currentUser);
            
            showBankScreen();
        }

        // Показ главного экрана банка
        function showBankScreen() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('bank-screen').classList.remove('hidden');

            const userData = db[currentUser];
            document.getElementById('user-display-name').innerText = userData.name;

document.getElementById('balance-value').innerText = userData.balance;

            const roleContainer = document.getElementById('role-container');
            const adminArea = document.getElementById('admin-area');

            // Проверка на админа строго по никнейму
            if (currentUser === ADMIN_NICKNAME) {
                roleContainer.innerHTML = '<span class="role-badge role-admin">Администратор</span>';
                adminArea.classList.remove('hidden');
                updateUsersDropdown();
            } else {
                roleContainer.innerHTML = '<span class="role-badge role-user">Пользователь</span>';
                adminArea.classList.add('hidden');
            }
        }

        // Выпадающий список пользователей для админа
        function updateUsersDropdown() {
            const select = document.getElementById('user-select');
            select.innerHTML = '';

            for (let key in db) {
                const option = document.createElement('option');
                option.value = key;
                option.innerText = `${db[key].name} (Баланс: ${db[key].balance})`;
                select.appendChild(option);
            }
        }

        // Изменение баланса админом
        function modifyBalance() {
            if (currentUser !== ADMIN_NICKNAME) {
                alert('У вас нет прав администратора!');
                return;
            }

            const targetUser = document.getElementById('user-select').value;
            const amount = parseInt(document.getElementById('coin-amount').value);

            if (isNaN(amount)) {
                alert('Введите число монет!');
                return;
            }

            db[targetUser].balance += amount;
            
            if (db[targetUser].balance < 0) {
                db[targetUser].balance = 0;
            }

            saveDB();
            showBankScreen();
            document.getElementById('coin-amount').value = '';
            alert(`Готово! Новый баланс ${db[targetUser].name}: ${db[targetUser].balance}`);
        }

        // Выход
        function logout() {
            currentUser = null;
            localStorage.removeItem('bank_current_user');
            document.getElementById('username-input').value = '';
            document.getElementById('bank-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
        }

        function saveDB() {
            localStorage.setItem('bank_users', JSON.stringify(db));
        }
    </script>
</body>
</html>
